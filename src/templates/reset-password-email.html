<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Password reset</title>
  </head>
  <body>
    <h2>Hello, {{name}} 👋</h2>

    <p>You requested a password reset.</p>

    <p>Click the button below to reset your password:</p>

    <a
      href="{{link}}"
      style="
        display: inline-block;
        padding: 10px 20px;
        background: #4caf50;
        color: #fff;
        text-decoration: none;
        border-radius: 5px;
      "
    >
      Reset password
    </a>

    <p>This link is valid for 15 minutes.</p>
  </body>
</html>
